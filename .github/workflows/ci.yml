name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  # Runs the pipeline again for a branch (on dev and main it also publishes
  # and rolls out, as a push does).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================================================================
  # 📐 TYPE CHECK
  # ================================================================
  typecheck:
    name: "📐 Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc -b --noEmit

  # ================================================================
  # 🧹 LINT
  # ================================================================
  # tsc above covers types. ESLint covers what a type-checker
  # cannot see: the rules of hooks, effect dependency arrays, an unused
  # import left behind by a refactor. Warnings are not fatal (there are ~157,
  # mostly `any`s forced by the hand-maintained API types); errors are.
  lint:
    name: "🧹 Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ================================================================
  # 🧪 TEST
  # ================================================================
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate Shields.io endpoint badge
        if: always()
        run: |
          PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          COLOR=$(node -e "const p=$PCT; console.log(p>=80?'brightgreen':p>=70?'green':p>=50?'yellow':p>=30?'orange':'red')")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage/badge.json
          echo "Coverage: ${PCT}% (${COLOR})"

      - name: Test Coverage Gate
        if: always()
        run: |
          # Lowered 2026-10 back to 40 %. Gate applies to every branch so
          # coverage regressions are caught before they reach dev/main.
          MIN_COVERAGE=40.0
          PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Current frontend coverage: ${PCT}%, required minimum: ${MIN_COVERAGE}%"
          node -e "const p = Number(require('./coverage/coverage-summary.json').total.lines.pct); if (p < $MIN_COVERAGE) { console.error('❌ Coverage Gate Failed: ' + p + '% < $MIN_COVERAGE%'); process.exit(1); } else { console.log('✅ Coverage Gate Passed: ' + p + '% >= $MIN_COVERAGE%'); }"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage
          retention-days: 14

  # The 📊 Coverage job used to live here (download the coverage-html
  # artifact from `test`, then publish to GitHub Pages on main). Removed:
  # Pages was never actually enabled for this repo, the README badge
  # pointed at the pre-rename org and had never resolved either, and
  # without the Pages steps the job did nothing `test`'s own
  # "Upload coverage report" step doesn't already do.

  # ================================================================
  # 🔒 SECURITY (deps + filesystem) — blocks on HIGH/CRITICAL
  # ================================================================
  # Runs in parallel with typecheck/test. Findings appear in the
  # GitHub Security tab via SARIF upload. Whitelist false positives
  # in `.trivyignore` (with a comment explaining why).
  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, HIGH+)
        run: npm audit --audit-level=high --omit=dev

      # Trivy fs runs twice on purpose:
      #   1. blocking gate — fails the job on HIGH/CRITICAL
      #   2. SARIF emit — uploads ALL findings (incl. ignored ones)
      #      to the Security tab so they remain visible
      # Trivy fs runs twice on purpose:
      #   1. blocking gate — fails the job on HIGH/CRITICAL
      #   2. SARIF emit — uploads ALL findings (incl. ignored ones)
      #      to the Security tab so they remain visible
      #
      # ``skip-files: Dockerfile.dev`` excludes the dev image from the
      # misconfig scan. The dev image runs locally with bind-mounted
      # source code and never reaches CI or production. The production
      # Dockerfile is fully scanned.
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: Dockerfile.dev
          exit-code: 1

      - name: Trivy filesystem scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: Dockerfile.dev
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy fs results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ================================================================
  # 🐳 BUILD — always runs, proves Dockerfile works
  # ================================================================
  build:
    name: "🐳 Build"
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, security]
    # Guard against a hung build burning the full 6h job budget. A
    # healthy amd64 image build finishes in a few minutes; anything
    # past 20 min is a hang, not slow progress.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          push: false
          # amd64 only: the deploy target (OpenStack VMs) is amd64, and
          # an emulated arm64 build hung in ``npm install`` under QEMU
          # and ran into the 6h job timeout. Re-add arm64 here (and in
          # the push job) only alongside a native arm64 runner.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # 🔒 IMAGE SCAN — Trivy CVE scan against the built image
  # ================================================================
  # Builds a single-platform amd64 image with --load so the local
  # Docker daemon can hand it to Trivy. The build cache is shared
  # with the multi-platform `build` job (cache-from: type=gha) so
  # this is mostly a thin layer on top.
  image-scan:
    name: "🔒 Image Scan"
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (amd64, --load)
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: frontend:scan
          cache-from: type=gha

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Trivy image scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy image results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ================================================================
  # 📦 PUSH — on main and dev
  # ================================================================
  push:
    name: "📦 Push"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write       # sign the image's origin (Sigstore, keyless)
      attestations: write   # store that signature with GitHub
    outputs:
      digest: ${{ steps.push-image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: push-image
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          push: true
          # amd64 only — see the note on the ``build`` job. Keep this
          # in sync with that job so the pushed image matches what CI
          # actually built and scanned.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signs which repository, workflow, branch and commit built this digest (SLSA
      # build provenance, keyless); the deployment repo rolls out only images that
      # have it (.github/scripts/verify-image.sh there).
      - name: Attest the image's origin
        if: steps.push-image.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dhbw-appstore-t3/frontend
          subject-digest: ${{ steps.push-image.outputs.digest }}

  # ================================================================
  # ☸️ ROLL OUT ON KUBERNETES — dev -> staging, main -> prod
  # ================================================================
  # The deployment repo pins the image just pushed (tag sha-<commit>) by its
  # digest in k8s/images/<staging|prod>.yaml; Argo CD of that environment
  # follows (see k8s-bump.yml there: a self-merging PR on dev,
  # a PR on main that a person approves).
  k8s-rollout:
    name: "☸️ Roll out on k8s"
    runs-on: ubuntu-latest
    needs: [push]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      # A one-hour token of the GitHub App "DHBW AppStore deploy" (installed only
      # on the deployment repository, Actions: write), not a personal token.
      - name: Token for the deployment repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: DHBW-AppStore-T3
          repositories: deployment
          permission-actions: write
      - name: Pin the new image in the deployment repo
        run: |
          gh workflow run k8s-bump.yml --repo DHBW-AppStore-T3/deployment --ref "$GITHUB_REF_NAME" \
            -f component=frontend -f tag="sha-${GITHUB_SHA::7}" -f digest="$DIGEST"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ needs.push.outputs.digest }}
