# The SPA, served by nginx as a non-root user (nginx-unprivileged, UID 101).
#
# The root filesystem can stay read-only: nginx writes only below /tmp (pid
# and temp files, set by the base image), and so does the entrypoint, which
# puts the runtime configuration into /tmp/runtime at start — env-config.js
# plus the listen and security-header snippets included below (see
# docker-entrypoint.sh). In Kubernetes /tmp is an emptyDir.

# Hashed build assets never change; everything else is revalidated, so a new
# release or a changed env-config.js is picked up at once.
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

# The scheme the browser used, for the API behind /api (api-gateway.conf) and
# for HSTS: TLS ends at the ingress controller, which says so in
# X-Forwarded-Proto.
map $http_x_forwarded_proto $appstore_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# HSTS only on what the browser fetched over HTTPS; an empty value sends no
# header (plain-HTTP development).
map $appstore_forwarded_proto $appstore_hsts {
  https   "max-age=31536000";
  default "";
}

server {
  # 8080 on IPv4, and on IPv6 where the kernel has it.
  include /tmp/runtime/listen.conf;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Headers for every response of the SPA. No location of it sets its own
  # add_header: one there would drop all of these for that location. The API
  # locations (api-gateway.conf) do, on purpose.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control $cache_control always;
  add_header Strict-Transport-Security $appstore_hsts always;
  # Content-Security-Policy (needs the Keycloak and API origins) and framing.
  include /tmp/runtime/security-headers.conf;

  location = /env-config.js {
    alias /tmp/runtime/env-config.js;
  }

  # The API under /api where this container is the gateway (Kubernetes);
  # empty otherwise. Its locations set their own headers.
  include /tmp/runtime/api-gateway.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
